name: Bruin CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Daily at 06:00 UTC — matches pipeline @daily schedule
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  validate:
    name: Bruin Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bruin CLI
        run: |
          curl -LsSf https://raw.githubusercontent.com/bruin-data/bruin/main/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Bruin version
        run: bruin --version

      - name: Validate pipeline
        run: bruin validate .
